[project]
name = "wowdicegame"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["game"]

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "pre-commit"]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"
